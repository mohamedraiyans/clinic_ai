server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # hashed build files can be cached for a long time; index.html must always be fresh
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;   # single-page app
    }
}
