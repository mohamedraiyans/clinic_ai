services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src

  # Run with: docker compose --profile test run --rm tests
  # Uses its own database (clinic_test), never the real one, and never calls a real LLM.
  tests:
    build: ./backend
    profiles: ["test"]
    env_file: .env
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/clinic_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - ./backend/tests:/code/tests
      - ./backend/pytest.ini:/code/pytest.ini
      - ./backend/requirements-dev.txt:/code/requirements-dev.txt
    command: sh -c "pip install -q --root-user-action=ignore --disable-pip-version-check -r requirements-dev.txt && python -m pytest"

volumes:
  pgdata:
